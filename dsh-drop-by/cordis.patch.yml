# ============================================================================
# dsh-drop-by —— DSH bundle patch
# ============================================================================
# 装到 profile 上以后，DSH 启动时把这一行插进配置树。
#
# ⚠ name 必须跟安装后的包名完全一致（dsh-drop-by），否则「装了但设置页 404」。
#
# 安装（本机开发，link 到源码目录）：
#   dsh plugin --profile desktop add llink:<你的插件目录>l
# 或者直接跑本目录的 install.ps1（它做的是一样的事，外加备份和 junction）。
#
# 装完设置页：http://127.0.0.1:<DSH 端口>/dsh-drop-by
# ============================================================================

- insert:
    - id: dsh-drop-by
      name: dsh-drop-by
